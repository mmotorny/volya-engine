[package]
name = "volya-engine-formats"
description = "Volya Engine: game file format parsers over Read + Seek, no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "volya-engine-db"
path = "src/bin/db.rs"

[dependencies]
lzokay-native = { workspace = true, features = ["decompress"] }
lewton.workspace = true
ogg.workspace = true
theora_nrp.workspace = true

[dev-dependencies]
crc32fast.workspace = true
lzokay-native = { workspace = true, features = ["compress", "decompress"] }
md-5.workspace = true
# An independent ETC2/EAC decoder checks the encoder (src/etc2.rs).
texture2ddecoder = "0.1"
volya-engine-installer = { path = "../volya-engine-installer" }
