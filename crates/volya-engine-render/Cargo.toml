[package]
name = "volya-engine-render"
description = "Volya Engine: WebGL 2 renderer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The render self-test (src/selftest), in test builds of the app.
selftest = []

[dependencies]
volya-engine-formats = { path = "../volya-engine-formats" }
bytemuck.workspace = true
js-sys.workspace = true
tracing.workspace = true
# The GL layer's WebGL 2 (src/gl.rs).
web-sys = { workspace = true, features = [
  "WebGl2RenderingContext",
  "WebGlBuffer",
  "WebGlFramebuffer",
  "WebGlProgram",
  "WebGlSampler",
  "WebGlShader",
  "WebGlSync",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
] }

[build-dependencies]
# Translates the programs to GLSL ES 3.00 at build time (build.rs).
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
