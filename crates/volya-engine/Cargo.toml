[package]
name = "volya-engine"
description = "Volya Engine: the platform-free product library every platform package builds on."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Draws through WebGL 2 (volya-engine-render), in the web build.
webgl = ["volya-engine-render/webgl"]
# The render self-test (volya-engine-render's `selftest`), in test builds.
render-selftest = ["volya-engine-render/selftest"]

[dependencies]
volya-engine-core = { path = "../volya-engine-core" }
volya-engine-formats = { path = "../volya-engine-formats" }
volya-engine-render = { path = "../volya-engine-render" }
volya-engine-script = { path = "../volya-engine-script" }
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
md-5.workspace = true
sha2.workspace = true
serde_json.workspace = true
pollster.workspace = true
tracing-subscriber.workspace = true
volya-engine-formats = { path = "../volya-engine-formats", features = ["etc2-decode"] }
volya-engine-installer = { path = "../volya-engine-installer" }
