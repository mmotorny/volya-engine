[workspace]
resolver = "3"
members = ["crates/*", "platforms/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/mmotorny/volya-engine"

[workspace.dependencies]
# xtask installs the wasm-bindgen CLI matching Cargo.lock.
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
inno = { version = "0.7", default-features = false }
md-5 = "0.11"
ogg = "0.9"
lewton = "0.10"
theora_nrp = "0.2"
zlib-rs = { version = "0.6", default-features = false, features = ["std"] }
lzokay-native = { version = "0.2", default-features = false }
crc32fast = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Decoding and hashing are too slow unoptimized for the real-data tests.
[profile.dev.package.theora_nrp]
opt-level = 3

[profile.dev.package.ogg_nrp]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.ogg]
opt-level = 3

[profile.dev.package.lewton]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true

# File install conditions exposed (docs/architecture.md, Game data).
[patch.crates-io]
inno = { git = "https://github.com/mmotorny/inno", branch = "expose-file-conditions" }
