[package]
name = "volya-engine-web"
description = "Volya Engine for web browsers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
# Engine ops only tests use (`debug_give_item`): in the dev and test builds,
# never in the deployed one.
test-ops = []
# The build for browsers that give no WebGPU adapter: draws through WebGL 2
# (#113). The page loads it only there, so wgpu's GL backend stays out of
# the WebGPU build's download (#186).
webgl = ["volya-engine/webgl"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
volya-engine = { path = "../../crates/volya-engine" }
volya-engine-formats = { path = "../../crates/volya-engine-formats" }
volya-engine-installer = { path = "../../crates/volya-engine-installer" }
js-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "Blob",
  "console",
  "File",
  "FileReaderSync",
  "FileSystemDirectoryHandle",
  "FileSystemFileHandle",
  "FileSystemGetDirectoryOptions",
  "FileSystemGetFileOptions",
  "FileSystemHandle",
  "FileSystemHandleKind",
  "FileSystemReadWriteOptions",
  "FileSystemRemoveOptions",
  "FileSystemSyncAccessHandle",
  "FileSystemSyncAccessHandleMode",
  "FileSystemSyncAccessHandleOptions",
  "OffscreenCanvas",
  "Performance",
  "StorageManager",
  "WorkerGlobalScope",
  "WorkerNavigator",
] }
